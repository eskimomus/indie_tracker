document.getElementById("mvArrow").addEventListener("click", (e) => {
  e.stopPropagation();
  if (sortField === "views") sortDirection = sortDirection === "asc" ? "desc" : "asc";
  else { sortField = "views"; sortDirection = "desc"; }
  updateSortArrows();
  render(true);
});
updateSortArrows();

/* ---------------- favorites ---------------- */

function saveFavorites() {
  localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
}

function toggleFavorite(gameId) {
  const isRemoving = favorites.has(gameId);
  if (isRemoving) favorites.delete(gameId);
  else favorites.add(gameId);
  saveFavorites();
  // Removing a favorite while *viewing* favorites-only shrinks the
  // currently-displayed list (the row disappears entirely) — the same
  // kind of list-content change as a filter/sort change, so it gets the
  // same resetView=true fade (see render()). In every other case, update the
  // button's class directly in-place so its background-color transitions
  // smoothly via CSS without recreating the DOM nodes.
  if (showingFavoritesOnly && isRemoving) {
    render(true);
  } else {
    document.querySelectorAll(`.badge-fav[data-fav-toggle="${gameId}"]`).forEach(el => {
      el.classList.toggle("active", !isRemoving);
    });
  }
}

const headerFav = document.getElementById("headerFav");
headerFav.addEventListener("click", () => {
  showingFavoritesOnly = !showingFavoritesOnly;
  headerFav.classList.toggle("active", showingFavoritesOnly);
  // .active already drives the heart's fill via CSS (see
  // #headerFav.active .header-fav-heart-fill); this just swaps the whole
  // page's palette to match, since "favorites" is the only place it applies.
  // Set the class on both html and body. Only html actually needs it for
  // CSS (--bg-base etc. live in `html.favorites-theme` and cascade down to
  // body regardless), but Chrome paints the "backdrop" behind fixed
  // elements specifically from html's background (see the #bgStripes
  // comment) while Safari's overscroll/tab-tint color-sampling is opaque
  // to us from here — keeping both classed is a free hedge against either
  // engine consulting the other element for some native, non-CSS purpose.
  document.documentElement.classList.toggle("favorites-theme", showingFavoritesOnly);
  document.body.classList.toggle("favorites-theme", showingFavoritesOnly);
  document.getElementById("themeColorMeta").setAttribute("content", showingFavoritesOnly ? "#533132" : "#415331");
  // page title stays "eskimo's indie tracker" in both states, per the
  // user's call — only the palette (favorites-theme) and theme-color meta
  // change
  render(true);
});

/* ---------------- relative date ---------------- */

function formatRelativeDate(iso) {
  if (!iso) return "—";
  const diffMs = Date.now() - new Date(iso).getTime();
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays <= 0) return "today";
  if (diffDays === 1) return "1 day ago";
  if (diffDays < 7) return `${diffDays} days ago`;
  const diffWeeks = Math.floor(diffDays / 7);
  if (diffWeeks === 1) return "1 week ago";
  return `${diffWeeks} weeks ago`;
}

// finer-grained than formatRelativeDate (minutes/hours, not just days) —
// ingestion runs every 6h, so day-level granularity would just say "today"
// for basically every update, which isn't very informative here.
function formatRelativeTime(iso) {
  if (!iso) return "—";
  const diffMs = Date.now() - new Date(iso).getTime();
  const diffMinutes = Math.floor(diffMs / (1000 * 60));
  if (diffMinutes < 1) return "just now";
  if (diffMinutes === 1) return "1 minute ago";
  if (diffMinutes < 60) return `${diffMinutes} minutes ago`;
  const diffHours = Math.floor(diffMinutes / 60);
  if (diffHours === 1) return "1 hour ago";
  if (diffHours < 24) return `${diffHours} hours ago`;
  return formatRelativeDate(iso);
}

// Plain ASCII space as the thousands separator (e.g. "22 888"), not a
// locale's toLocaleString() — locales that use a space for this
// (fr-FR, ru-RU, ...) actually use a non-breaking or narrow-no-break space
// depending on browser/ICU data, not a guaranteed plain U+0020, and en-US
// gives commas. Inserting it directly guarantees the exact character.
function formatViews(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

/* ---------------- render ---------------- */

function extractVideoId(watchUrl) {
  try { return new URL(watchUrl).searchParams.get("v"); } catch { return null; }
}

function renderContactRow(game, row) {
  const url = game.contacts[row.key];
  const found = Boolean(url);
  const isPriority = found && appliedPriority.includes(row.key === "instagram" ? "instagram" : row.key);
  const badge = !found
    ? `<img class="badge badge-cross" src="${PNG_ASSETS}/${CROSS_FILES[row.key.length % 2]}.png" alt="">`
    : (isPriority ? `<img class="badge badge-star" src="${PNG_ASSETS}/${STAR_FILES[row.key.length % 2]}.png" alt="">` : "");

  const iconFile = !found
    ? ICON_FILES[row.icon] + "-inactive"
    : (showingFavoritesOnly && row.icon === "web" ? "web-favorites" : ICON_FILES[row.icon]);
  const inner = `
    <div class="contact-icon-wrap">
      <img class="icon" src="${PNG_ASSETS}/${iconFile}.png?v=3" alt="">
      ${badge}
    </div>
    <span class="contact-label">${row.label}</span>
  `;

  const rowClass = `contact-row contact-row-${row.icon} ${found ? "" : "missing"}`;
  return found
    ? `<div class="${rowClass}"><a href="${url}" target="_blank" rel="noopener">${inner}</a></div>`
    : `<div class="${rowClass}">${inner}</div>`;
}

// YouTube serves a thumbnail at this fixed path convention keyed only by
// video ID (i.ytimg.com, no API key/quota needed) — used instead of the
// "medium" (320x180) thumbnail_url stored from the Data API at ingestion
// time, since maxresdefault.jpg (1280x720, when the uploader provided one)
// is dramatically sharper at this row's ~860px display width. maxresdefault
// doesn't 404 when missing though — it silently serves a fixed 120x90 grey
// placeholder instead — so attachRowListeners below checks the loaded
// image's real width and swaps to hqdefault.jpg (480x360, always present
// for any real video) if it got the placeholder.
function renderThumbnailImg(g, videoId) {
  if (!videoId) {
    return g.best_source.thumbnail_url
      ? `<img src="${g.best_source.thumbnail_url}" alt="${g.best_source.title}">`
      : "";
  }
  return `<img data-thumb-video-id="${videoId}" src="https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg" alt="${g.best_source.title}">`;
}

function renderRowHtml(g, index) {
  const videoId = extractVideoId(g.best_source.url);
  const isFav = favorites.has(g.id);

  return `
    <div class="row" data-game-id="${g.id}">
      <div class="row-head">
        <div class="row-head-title"><a href="${g.best_source.url}" target="_blank" rel="noopener">${g.best_source.title}</a></div>
        <div class="row-head-meta">${formatViews(g.best_source.metric_value)} views &middot; ${formatRelativeTime(g.best_source.published_at)}</div>
      </div>

      <div class="divider divider-top"></div>

      <div class="row-media">
        <div class="video-wrap">
          <div class="video-bg"></div>

          <div class="badge-rank">
            <div class="badge-rank-inner">
              <div class="badge-rank-num">#${index + 1}</div>
            </div>
          </div>

          <div class="badge-fav ${isFav ? "active" : ""}" data-fav-toggle="${g.id}">
            <div class="badge-fav-inner">
              <div class="fav-heart-mask"></div>
            </div>
          </div>

          <div class="video-thumb" data-video-url="${g.best_source.url}">
            ${renderThumbnailImg(g, videoId)}
            ${videoId ? `<div class="play-btn"><div class="play-btn-circle"></div><div class="play-btn-triangle"></div></div>` : ""}
          </div>
        </div>

        <div class="contacts-wrap">
          <div class="contacts-bg"></div>
          <div class="contacts-list">
            ${CONTACT_ROWS.map(row => renderContactRow(g, row)).join("")}
          </div>
        </div>
      </div>

      <div class="divider-bottom-container">
        <div class="divider divider-bottom"></div>
        <div class="more-btn" data-more-toggle="${g.id}">
          <div class="more-btn-back"></div>
          <div class="more-btn-symbol"></div>
        </div>
      </div>

      <div class="row-description-wrap" data-desc-wrap="${g.id}">
        <div class="row-description-content">
          <div class="description-box">
            <div class="description-back"></div>
            <div class="description-text">${escapeHtml(g.best_source.description || "No description available.")}</div>
          </div>
          <div class="divider divider-bottom-extra"></div>
        </div>
      </div>
    </div>`;
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function attachRowListeners(root) {
  root.querySelectorAll("[data-fav-toggle]").forEach(el => {
    el.addEventListener("click", () => toggleFavorite(Number(el.dataset.favToggle)));
  });

  root.querySelectorAll(".description-text").forEach(el => {
    const updateMask = () => {
      const isScrolled = el.scrollTop > 2;
      const isAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight <= 2;
      el.classList.toggle("scrolled", isScrolled);
      el.classList.toggle("at-bottom", isAtBottom);
    };
    updateMask();
    el.addEventListener("scroll", updateMask, { passive: true });
    el._updateDescMask = updateMask;
    attachDescScrollEasing(el);
  });

  root.querySelectorAll("[data-more-toggle]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const gameId = el.dataset.moreToggle;
      const row = el.closest(".row");
      const wrap = row ? row.querySelector(".row-description-wrap") : document.querySelector(`[data-desc-wrap="${gameId}"]`);
      if (!wrap) return;
      const isOpen = el.classList.toggle("open");
      wrap.classList.toggle("open", isOpen);
      if (isOpen) openDescriptions.add(gameId); else openDescriptions.delete(gameId);
      // wrap.dataset.openHeight is set per-row by fitRowDescription() to
      // match whichever description-N backdrop that row's actual line
      // count needs — replaces a single fixed open height for every row.
      wrap.style.height = isOpen ? (wrap.dataset.openHeight + "px") : "0px";
      if (isOpen && row) {
        const descEl = row.querySelector(".description-text");
        if (descEl && descEl._updateDescMask) {
          setTimeout(descEl._updateDescMask, 50);
        }
      }
    });
  });

  root.querySelectorAll(".video-thumb").forEach(el => {
    el.addEventListener("click", () => {
      const videoId = extractVideoId(el.dataset.videoUrl);
      if (!videoId) return;
      playVideoInline(el, videoId, el.dataset.videoUrl);
    });
  });

  // see renderThumbnailImg above — falls back to hqdefault.jpg in two
  // separate cases: maxresdefault.jpg loaded fine but turned out to be the
  // grey "no high-res thumbnail" placeholder (always exactly 120x90,
  // unlike any real thumbnail at this aspect ratio), or the request
  // genuinely failed to load at all (seen in practice as an isolated
  // transient hiccup against i.ytimg.com — a bare reload of the same URL
  // succeeded) — that path only ever fires "error", never "load", so it
  // needs its own listener rather than being caught by the width check.
  root.querySelectorAll("img[data-thumb-video-id]").forEach(img => {
    const fallbackToHq = () => {
      img.src = `https://i.ytimg.com/vi/${img.dataset.thumbVideoId}/hqdefault.jpg`;
    };
    img.addEventListener("load", () => {
      if (img.naturalWidth <= 120) fallbackToHq();
    }, { once: true });
    img.addEventListener("error", fallbackToHq, { once: true });
  });
}

// Rendered incrementally rather than all at once: with the dataset having
// grown to hundreds of rows (each carrying several mask-image layers, all
// inside the zoom-scaled canvas, so their real on-screen pixel cost scales
// with viewport size), building every row up front made the page tall and
// heavy enough to run into real rendering-resource limits on some
// machines — surfacing as a scroll that barely nudges instead of paging
// through, worse on wider windows and worse the more the dataset grows,
// which matches a resource ceiling rather than a specific logic bug.
// Rendering a bounded batch at a time keeps the live DOM/paint cost
// roughly constant regardless of how large the underlying list gets.
const ROW_BATCH_SIZE = 30;
let currentList = [];
let renderedCount = 0;
// True from the moment a resetView render's fade-out starts until its
// DOM swap actually happens — see the maybeLoadMoreRows comment below for
// why this exists.
let renderTransitionInProgress = false;

// Binary-searches the longest prefix of `fullTitle` (+ a literal "...")
// that still fits `link`'s box — see the .row-head-title comment in
// <style> for why this replaces the native CSS ellipsis. Canvas-relative
// (zoom scales link and container identically), so this never needs
// re-running on window resize — only once, right after a row is inserted.
// Single offscreen canvas reused for every title measurement, rather than
// writing candidate text into the live <a> and reading back
// getBoundingClientRect() on each binary-search step — that forced a real
// synchronous layout recalculation on *every* read (up to ~8 per title),
// which across a fresh batch of 30 rows added up to ~240 forced layouts
// to renderMoreRows(), on top of everything else it already does for a
// batch of mask-heavy rows. measureText() computes the same width without
// ever touching the DOM/layout, cutting this down to one single real
// layout read per row (container.clientWidth) regardless of title length.
const titleMeasureCtx = document.createElement("canvas").getContext("2d");

function fitRowTitle(link, fullTitle) {
  const container = link.parentElement;
  if (!container) return;
  link.dataset.fullTitle = fullTitle;
  // Use unscaled authored font size for Canvas measureText, and convert container's rendered
  // bounding width to unzoomed design coordinates by dividing by the current scale.
  // This ensures text width and container width are compared in exact 100% unscaled design
  // coordinates (1920px width reference), regardless of browser zoom behavior or window size.
  const scale = parseFloat(document.getElementById("canvas").style.zoom) || (window.innerWidth / 1920 * getPageScale()) || 1;
  const cs = getComputedStyle(link);
  titleMeasureCtx.font = `${cs.fontSize} ${cs.fontFamily}`;
  const maxWidth = container.getBoundingClientRect().width / scale;
  if (titleMeasureCtx.measureText(fullTitle).width <= maxWidth) {
    link.textContent = fullTitle;
    return;
  }
  let lo = 0, hi = fullTitle.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (titleMeasureCtx.measureText(fullTitle.slice(0, mid) + "...").width <= maxWidth) lo = mid;
    else hi = mid - 1;
  }
  link.textContent = fullTitle.slice(0, lo) + "...";
}

function refitAllRowTitles() {
  document.querySelectorAll(".row-head-title a").forEach(link => {
    const fullTitle = link.dataset.fullTitle;
    if (fullTitle) fitRowTitle(link, fullTitle);
  });
}

// One description-N.png backdrop per line count, 1 through 10 (see
// scripts/render-masks.py) — DESC_HEIGHTS[i] is that backdrop's own
// design-spec height (i+1 lines). DESC_BOX_PADDING is .description-box's
// own padding-top(16) + padding-bottom(20); DESC_WRAP_EXTRA is
// .row-description-content's padding-top(13, the gap above the backdrop)
// + .description-box's own margin-bottom(13, the gap below it) +
// .divider-bottom-extra's height(20) — all fixed, unrelated to line
// count, added on top of whichever backdrop height was picked to get the
// box's/wrap's own total height.
const DESC_LINE_HEIGHT = 35;
const DESC_HEIGHTS = [70, 106, 142, 177, 212, 245, 282, 314, 354, 385];
const DESC_BOX_PADDING = 36;
const DESC_WRAP_EXTRA = 46;
const DESC_FADE_ZONE = 19;

// Picks the description-N backdrop matching `row`'s actual description
// length and sizes everything around it (the box, the text's own
// scrollable max-height, the fade-out gradient position, and the stored
// height the more-toggle uses to open .row-description-wrap) to match.
//
// Line count comes from measuring .description-text's own natural
// scrollHeight rather than trying to simulate the browser's pre-wrap/
// word-break line-wrapping ourselves (compare fitRowTitle, which only
// ever needs a single-line width check) — scrollHeight already reflects
// the *real* layout engine's own wrapping exactly, unclamped by whatever
// max-height was previously set, the same way it's used everywhere else
// in this file regardless of overflow clipping.
function fitRowDescription(row) {
  const descBack = row.querySelector(".description-back");
  const descText = row.querySelector(".description-text");
  const descBox = row.querySelector(".description-box");
  const wrap = row.querySelector(".row-description-wrap");
  if (!descBack || !descText || !descBox || !wrap) return;

  const naturalHeight = descText.scrollHeight;
  const lineCount = Math.max(1, Math.round(naturalHeight / DESC_LINE_HEIGHT));
  const cappedLines = Math.min(lineCount, DESC_HEIGHTS.length);
  const designCapacity = DESC_HEIGHTS[cappedLines - 1] - DESC_BOX_PADDING;
  // Up to 10 lines, never clip below what the text actually needs — the
  // backdrop's own designed capacity can be a pixel or two tight for some
  // line counts (Figma's given heights aren't perfectly N*lineHeight+
  // padding for every N). Past 10 lines, DESC_HEIGHTS[9]'s capacity
  // becomes a hard, intentional cap instead — that's what triggers the
  // existing scrollbar/fade for anything longer.
  const textMaxHeight = lineCount > DESC_HEIGHTS.length
    ? designCapacity
    : Math.max(naturalHeight, designCapacity);
  const boxHeight = textMaxHeight + DESC_BOX_PADDING;

  descBack.style.maskImage = `url(assets/masks/description-${cappedLines}.png?v=3)`;
  descBack.style.webkitMaskImage = descBack.style.maskImage;
  descBox.style.height = boxHeight + "px";
  descText.style.maxHeight = textMaxHeight + "px";
  descText.style.setProperty("--desc-fade-start", Math.max(0, textMaxHeight - DESC_FADE_ZONE) + "px");
  descText.style.setProperty("--desc-fade-end", textMaxHeight + "px");
  wrap.dataset.openHeight = boxHeight + DESC_WRAP_EXTRA;

  // Re-apply an already-open state after a full row rebuild (render()
  // tears down and recreates every .row on a filter change) — done here,
  // synchronously right after insertion and with no forced reflow in
  // between, so the browser never observes a height:0 frame to transition
  // away from and the panel just appears open, not animating open.
  if (openDescriptions.has(wrap.dataset.descWrap)) {
    wrap.classList.add("open");
    wrap.style.height = wrap.dataset.openHeight + "px";
    const moreBtn = row.querySelector("[data-more-toggle]");
    if (moreBtn) moreBtn.classList.add("open");
  }
}

function refitAllRowDescriptions() {
  document.querySelectorAll(".row").forEach(row => fitRowDescription(row));
}

// Native wheel-scrolling jumps straight to wherever the input device's
// delta lands, tick by tick, with no easing of its own — dragging the
// scrollbar thumb itself stays untouched (a drag has to track the mouse
// 1:1, there's nothing to ease there), but a wheel/trackpad tick over the
// text gets animated toward its target instead, accelerating in and
// decelerating out like everything else's cubic-bezier(0.45, 0, 0.55, 1)
// motion on this page.
const DESC_SCROLL_EASE_DURATION = 380;
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function attachDescScrollEasing(el) {
  let target = null; // current in-flight animation's destination scrollTop
  let sessionId = 0;

  el.addEventListener("wheel", (e) => {
    const maxScroll = el.scrollHeight - el.clientHeight;
    if (maxScroll <= 0) return; // nothing to scroll — let the event pass through untouched

    const base = target !== null ? target : el.scrollTop;
    // already at the boundary in the direction being scrolled — don't
    // swallow the event, so the page itself can still scroll (native
    // overscroll-chaining) instead of the wheel feeling "stuck". A 2px
    // tolerance, not exact equality against maxScroll: scrollHeight/
    // clientHeight are integer-rounded even when the underlying layout is
    // fractional, so the *real* max scrollTop the browser ever actually
    // lands on sits a little under this maxScroll (measured ~1.16px on a
    // 2174px-tall description) — comparing base to maxScroll exactly would
    // mean this branch never fires once genuinely at the bottom.
    if ((e.deltaY < 0 && base <= 2) || (e.deltaY > 0 && base >= maxScroll - 2)) return;
    const clamped = Math.max(0, Math.min(maxScroll, base + e.deltaY));

    e.preventDefault();
    target = clamped;
    const myId = ++sessionId;
    const startTop = el.scrollTop;
    const startTime = performance.now();

    requestAnimationFrame(function step(now) {
      if (myId !== sessionId) return; // a newer wheel tick took over — let it drive instead
      const t = Math.min(1, (now - startTime) / DESC_SCROLL_EASE_DURATION);
      el.scrollTop = startTop + (target - startTop) * easeInOutCubic(t);
      if (t < 1) requestAnimationFrame(step);
      else target = null;
    });
  }, { passive: false });
}

function renderMoreRows(count = ROW_BATCH_SIZE) {
  const rowsEl = document.getElementById("rows");
  const sentinel = document.getElementById("scrollSentinel");
  const nextBatch = currentList.slice(renderedCount, renderedCount + count);
  if (!nextBatch.length) return;

  const template = document.createElement("template");
  template.innerHTML = nextBatch.map((g, i) => renderRowHtml(g, renderedCount + i)).join("");
  // captured in document order (one .row-head-title a / .row per row, same
  // order as nextBatch) *before* insertion — insertBefore below moves
  // these exact nodes into the live document rather than cloning them, so
  // the references stay valid (and now measurable) afterward.
  const titleLinks = [...template.content.querySelectorAll(".row-head-title a")];
  const rows = [...template.content.querySelectorAll(".row")];
  attachRowListeners(template.content);
  rowsEl.insertBefore(template.content, sentinel);

  nextBatch.forEach((g, i) => fitRowTitle(titleLinks[i], g.best_source.title));
  rows.forEach(row => fitRowDescription(row));

  renderedCount += nextBatch.length;
  rescale();
}

// Checked directly via getBoundingClientRect on scroll, rather than an
// IntersectionObserver watching the sentinel — this app scales its whole
// layout with CSS `zoom` (not transform; see rescale() below), which has
// already turned out, more than once, to not reliably propagate into
// other browser geometry/layout APIs the way plain getBoundingClientRect
// does. Simpler and consistent with everything else in this file that
// needs zoom-aware positioning.
function maybeLoadMoreRows() {
  // A resetView render (see render() below) resets currentList/renderedCount
  // to the *new* filter's data synchronously, up front — but the actual DOM
  // (and #scrollSentinel) keeps showing the *old* rows until the fade-out
  // finishes, a couple hundred ms later. A scroll landing in that window
  // (a lingering momentum-scroll tick is enough) used to run this against
  // that mismatch: new counters, stale sentinel/DOM — inserting a slice of
  // the new list before a sentinel about to be thrown away, and leaving
  // renderedCount overcounting rows that never actually stuck around once
  // the fade's own DOM swap ran right after. Bailing out entirely while a
  // transition is in flight removes the mismatched state to run against;
  // render()'s own applyContent() calls this again right after its DOM
  // swap anyway, so nothing is missed, just deferred those few hundred ms.
  if (renderTransitionInProgress) return;
  const sentinel = document.getElementById("scrollSentinel");
  if (!sentinel) return;
  // loops rather than loading a single batch: one batch might not be
  // enough to push the sentinel past the threshold on a large/tall
  // viewport, and nothing else would prompt loading the rest until an
  // actual scroll happened
  while (renderedCount < currentList.length && sentinel.getBoundingClientRect().top < window.innerHeight + 1000) {
    renderMoreRows();
  }
}

let scrollCheckQueued = false;
window.addEventListener("scroll", () => {
  if (scrollCheckQueued) return;
  scrollCheckQueued = true;
  requestAnimationFrame(() => {
    scrollCheckQueued = false;
    maybeLoadMoreRows();
    stopDistantVideos();
  });
});

// Cross-fades #rows (opacity only) around a resetView content swap — see
// render() below. Reuses onceTransitionEnd (defined above, next to the
// dropdown animations) to wait out the fade-out before actually touching
// the DOM.
function fadeRowsOut(rowsEl, cb) {
  if (getComputedStyle(rowsEl).opacity === "0") { cb(); return; }
  rowsEl.style.opacity = "0";
  onceTransitionEnd(rowsEl, "opacity", cb);
}
function fadeRowsIn(rowsEl) {
  rowsEl.style.opacity = "0";
  rowsEl.offsetHeight; // force layout flush so the freshly-swapped content starts from opacity:0 before animating to 1, instead of the browser coalescing both writes and skipping the transition

  // Double rAF before actually starting the reveal — Safari specifically
  // (this file's rows are mask-image-heavy: badges, video/contacts panels,
  // and Safari's mask-image rasterizing is the documented weak point
  // throughout this project already, see scripts/render-masks.py) needs
  // noticeably longer to paint a freshly-inserted batch of 30 rows than
  // Chrome does — and needs longer for the *bigger* masks (the 884x509
  // video panel, the 391x509 contacts panel) than the small ones (the
  // ~111px rank/favorite badges). Starting the opacity transition
  // immediately after insertion only gave Safari the transition's own
  // 250ms to finish that paint work *while already becoming visible*, so
  // cheap-to-paint pieces (plain text, small masks) would show up before
  // the expensive ones had finished rasterizing — a brief flash of "just
  // the small badges" during every filter/result update, Safari only.
  // Note: see also the comment on .rows in CSS above regarding explicit
  // stacking contexts (z-index: 1, isolation: isolate) and CALayer groups
  // (translate3d, will-change: opacity), which prevent Safari from hoisting
  // z-index: 2 masked badges out of the container opacity transition.
  // rAF fires before the *next* paint, so scheduling the reveal for the
  // *second* one guarantees a real paint of the new (still-opacity:0, so
  // invisible) content already happened in between — nothing left to
  // catch up on once opacity actually starts moving.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      rowsEl.style.opacity = "1";
    });
  });
}

// Swaps #rows to one of the empty-state messages. The favorites-empty case
// gets special handling: collapsing straight to it can leave the page far
// shorter than wherever the user had scrolled to (they emptied out their
// favorites while deep in a long list), and a document that suddenly can't
// be scrolled that far anymore makes the browser itself snap scrollY back
// up *instantly* the moment rescale() shrinks body's min-height below it —
// there's no native "smooth" version of that clamp. So: swap the DOM and
// measure where that native clamp *would* land first, then undo it (repin
// the page tall, put scrollY back where the user actually was) and glide
// there ourselves with the same easing used elsewhere on the page, only
// letting the page actually shrink once that glide finishes.
function showEmptyState(rowsEl, cls, msg) {
  const isFavEmpty = cls.includes("empty-state-favorites");
  const startScrollY = window.scrollY;
  const startBodyMinHeight = document.body.style.minHeight;

  rowsEl.innerHTML = `<div class="${cls}">${msg}</div>`;
  rescale();

  if (!isFavEmpty) return;
  const targetScrollY = window.scrollY; // wherever rescale()'s shrink just (instantly) clamped to
  if (targetScrollY >= startScrollY) return; // wasn't below the empty state's own lowest point to begin with

  document.body.style.minHeight = Math.max(document.documentElement.scrollHeight, startScrollY + window.innerHeight) + "px";
  // Force a synchronous reflow before scrolling back up — without this,
  // the browser hasn't actually applied the taller min-height yet by the
  // time scrollTo below runs, so it still measures the *old* (short) page
  // and clamps right back to targetScrollY instead of genuinely restoring
  // startScrollY, leaving nothing for the rAF animation below to animate.
  document.body.offsetHeight;
  window.scrollTo(0, startScrollY);

  const duration = 500;
  const startTime = performance.now();
  requestAnimationFrame(function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    window.scrollTo(0, startScrollY + (targetScrollY - startScrollY) * easeInOutCubic(t));
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      document.body.style.minHeight = startBodyMinHeight;
      rescale();
    }
  });
}

function render(resetView = false) {
  // toggling a favorite, applying preferred contacts, etc. all funnel
  // through here too, not just genuine filter/dataset changes —
  // re-rendering only ROW_BATCH_SIZE rows every time would yank the list
  // back to the top batch out from under someone who'd scrolled deep in
  // just to favorite something. Keep however many rows were already
  // visible for those; callers that actually change *what* the list is
  // (new filter results, switching to/from favorites-only, re-sorting by
  // priority) pass resetView so they start clean at the top instead.
  const previousRenderedCount = resetView ? 0 : renderedCount;
  currentList = sortAndFilter();
  renderedCount = 0;

  const rowsEl = document.getElementById("rows");

  const applyContent = () => {
    // Safe to clear right at the top, before touching the DOM at all: the
    // rest of this function runs synchronously with no await/microtask
    // gap, so nothing else (a scroll handler, say) can possibly observe
    // this as false until the DOM rebuild below has already finished.
    renderTransitionInProgress = false;
    if (!currentList.length) {
      const msg = showingFavoritesOnly ? "you don't love anything. heartless." : "Nothing matches the current filter.";
      const cls = showingFavoritesOnly ? "empty-state empty-state-favorites" : "empty-state";
      showEmptyState(rowsEl, cls, msg);
    } else {
      rowsEl.innerHTML = `<div id="scrollSentinel"></div>`;
      const initialCount = Math.max(ROW_BATCH_SIZE, Math.min(previousRenderedCount, currentList.length));
      renderMoreRows(initialCount);
      // in case that initial batch doesn't even fill the viewport (e.g. a
      // very tall/short window), keep loading more until it does or the
      // list runs out, instead of waiting for a scroll event that may
      // never come
      maybeLoadMoreRows();
    }
    if (resetView) fadeRowsIn(rowsEl);
  };

  // Only cross-fade for a genuine filter/dataset change (resetView), and
  // only if there's actually something on screen yet to fade out (skips
  // the fade on first page load, when #rows starts out empty) — the
  // favorite-toggle/etc. re-renders (resetView=false) stay instant, since
  // fading the whole visible batch just to reflect one heart click would
  // read as overkill and would interrupt anyone mid-scroll.
  if (resetView && rowsEl.children.length) {
    renderTransitionInProgress = true;
    fadeRowsOut(rowsEl, applyContent);
  } else {
    applyContent();
  }
}

/* ---------------- apply-contacts button ---------------- */

/* "preferred contacts" changes are staged in pendingPriority (see
   renderContactsDropdown) rather than applied immediately, so picking
   several contact types doesn't re-sort/re-render the list after every
   click. This button — visible only while there's a staged change not yet
   reflected in the results — copies it over to appliedPriority and
   re-renders. It never touches the backend/database. */
const applyContactsBtn = document.getElementById("applyContactsBtn");

function prioritiesEqual(a, b) {
  if (a.length !== b.length) return false;
  const setB = new Set(b);
  return a.every(v => setB.has(v));
}

function updateApplyButton() {
  const shouldShow = !prioritiesEqual(pendingPriority, appliedPriority);
  if (shouldShow) {
    applyContactsBtn.classList.remove("is-hidden");
  } else {
    applyContactsBtn.classList.add("is-hidden");
  }
}

applyContactsBtn.addEventListener("click", () => {
  appliedPriority = pendingPriority.slice();
  render(true);
  updateApplyButton();
});

/* ---------------- scale-to-fit 1920 canvas ---------------- */

/* `zoom` instead of `transform: scale` — transform only stretches an
   already-painted bitmap, and Safari caches SVG filter output (our
   hand-drawn feTurbulence/feDisplacementMap look) at a fixed, low-DPI
   resolution before that stretch happens, so filtered pieces come out
   soft/blocky there (Chromium re-rasterizes correctly and hides the bug).
   zoom actually re-lays-out the subtree at the target size, so every
   filter is recomputed at real resolution regardless of browser. */
// Page-wide scale multiplier on top of the normal scale-to-fit factor
// below — 0.7 shrinks every element (fonts, paddings, masks, gaps, the
// works) to 70% of its previous on-screen size while every design-space
// CSS px value in this file stays untouched, since it's all still
// expressed relative to canvas's own 1920px reference and just gets
// multiplied through here. #canvas no longer spans the full viewport
// width once this is under 1, hence the margin:0 auto added alongside it.
function getPageScale() {
  const w = window.innerWidth;
  if (w <= 768) return 0.91; // +30% к текущему размеру (0.7 * 1.3 = 0.91)
  if (w <= 1024) return 0.8;
  return 0.7;
}

function rescale() {
  const canvas = document.getElementById("canvas");
  const scale = (window.innerWidth / 1920) * getPageScale();
  canvas.style.zoom = scale;
  // scrollHeight is measured in canvas's own unzoomed local pixels, not the
  // zoomed size actually painted on screen — using it directly here left
  // body far taller than the visible canvas, exposing its plain (unstriped)
  // background beneath.
  //
  // min-height, not height: this multiplication is only ever an
  // approximation of canvas's true on-screen height (a sub-pixel rounding
  // gap between the two was the actual cause of the long-hunted
  // intermittent scroll bug — see the html/body overflow comment above).
  // A plain height can end up a fraction of a pixel shorter than canvas's
  // real height; min-height can't undershoot the same way, since body's
  // box then just grows to fit canvas if canvas is ever taller than this
  // estimate, instead of clipping/mismatching against it.
  document.body.style.minHeight = canvas.scrollHeight * scale + "px";

  // see the .page-vignette comment in <style> — position:fixed there now,
  // so this is purely about keeping its width proportional to the design,
  // the same zoom trick as #fixedUiAnchor just above.
  document.querySelectorAll(".page-vignette").forEach(el => {
    el.style.zoom = scale;
  });

  // centers "you don't love anything. heartless." between the header's
  // bottom edge and the real screen bottom (see .empty-state-favorites in
  // <style>) — 351 is #toolbarWrap's own height, and .page's padding-top
  // (40px) already eats into that span before this element even starts,
  // so both get subtracted from the remaining viewport space (converted
  // to canvas-local units the same way the vignette's width is) to get
  // this element's own height right; flex centering (in CSS) does the
  // rest. Recomputed here so it stays centered if the window resizes
  // while this state is showing, not just when it first appears.
  const favEmpty = document.querySelector(".empty-state-favorites");
  if (favEmpty) {
    favEmpty.style.height = ((window.innerHeight / scale) - 351 - 40) + "px";
  }
  refitAllRowTitles();
}
window.addEventListener("resize", rescale);

rescale();
loadGames();
loadLastUpdated();

// Re-fit titles (and re-measure descriptions' own line counts — same
// font, same async-loading concern) after async web fonts finish loading,
// so both are computed against true Darumadrop One glyph metrics rather
// than the narrower fallback font.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    refitAllRowTitles();
    refitAllRowDescriptions();
    setTimeout(refitAllRowTitles, 500);
    setTimeout(refitAllRowDescriptions, 500);
    setTimeout(refitAllRowTitles, 1500);
    setTimeout(refitAllRowDescriptions, 1500);
  });
} else {
  setTimeout(refitAllRowTitles, 500);
  setTimeout(refitAllRowDescriptions, 500);
  setTimeout(refitAllRowTitles, 1500);
  setTimeout(refitAllRowDescriptions, 1500);
}
// .ready's timing is the flaky part (see above) — "loadingdone" is a plain
// FontFaceSet event that fires whenever a font the page actually tried to
// use finishes loading, in every browser that supports it, so it catches
// a late Darumadrop swap this file's own fixed 500/1500ms guesses above
// might land before or after (a slow/throttled connection can push the
// real swap past both). A description measured against the fallback
// font's narrower glyphs can under-count its own line count — its
// max-height then ends up shorter than the real Darumadrop text needs,
// which is what shows up as an unwanted scrollbar on something that's
// genuinely 10 lines or fewer.
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener("loadingdone", () => {
    refitAllRowTitles();
    refitAllRowDescriptions();
  });
}

// Preloader: covers the whole page on entry and after 0.2s slides down with non-linear acceleration
setTimeout(() => {
  const preloader = document.getElementById("preloader");
  if (preloader) {
    preloader.classList.add("hide");
    preloader.addEventListener("transitionend", () => preloader.remove(), { once: true });
    setTimeout(() => preloader.remove(), 1200);
  }
}, 200);
</script>
</body>
</html>
