<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="themeColorMeta" content="#415331">
<title>eskimo's indie tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preload" href="assets/masks/ud-title.png?v=2" as="image">
<link rel="preload" href="assets/masks/ud-opened.png?v=2" as="image">
<link rel="preload" href="assets/masks/mv-title.png?v=2" as="image">
<link rel="preload" href="assets/masks/mv-opened.png?v=2" as="image">
<link rel="preload" href="assets/masks/contacts-cap.png?v=2" as="image">
<link rel="preload" href="assets/masks/contacts-panel.png?v=2" as="image">
<link rel="preload" href="assets/masks/header-fav-bg.png?v=2" as="image">
<style>
  /*
    Theme colors live as CSS variables so a future "favorites" page
    (different color scheme, per design spec) can override just this
    block and reuse every component untouched.
  */
  :root {
    --bg-base: #455934;
    --bg-stripe: #415331;

    --panel-dark: #1C2C21;
    --pill-dim: #3C4732;
    --pill-bright: #455339;

    --badge-rank: #657D51;
    --more-bg: #657D51;
    --more-bg-hover: #7E966A;
    --desc-bg: #1C2C21;
    --desc-scroll-thumb: rgba(126, 150, 106, 0.60);
    --badge-fav-inactive: #989794;
    --badge-fav-active: #C14459;
    --fav-heart-color: #DEDEDE;
    --fav-heart-color-active: #FFFFFF;
    --header-fav-heart: #FFFFFF;
    /* header heart button's own background/active-fill, split off from
       --pill-bright / --badge-fav-active (which it originally just
       reused) so the favorites-page theme below can recolor the header
       heart independently of the other header buttons and the per-row
       favorite badges. */
    --header-fav-bg: #455339;
    --header-fav-heart-active: #C14459;

    --divider-color: #24372A;
    --refresh-bg: #FFFFFF;
    --refresh-icon: #1C2C21;
    --refresh-icon-hover: #455934;

    --text: #FFFFFF;
    --text-hover: #D5E0CB;
    --text-muted: #97A188;
    --option-muted: #818D77;
    --option-hover: #B5C5A8;
    --contact-label-inactive: #6B6B6B;

    --star-color: #FFC400;
    --cross-color: #BE4545;

    --last-updated-color: #7D916B;

    --eskimo-hover: #B5C5A8;
    --web-hover: #A7B898;
    --header-fav-heart-hover: #D5E0CB;
  }

  /* favorites-page palette — toggled by JS (`documentElement.classList.
     toggle("favorites-theme", showingFavoritesOnly)`) alongside
     #headerFav's own .active class, so it's active exactly when the page
     title reads "favorites". Every other CSS rule keeps referencing the
     same vars; only their values change here.
     On <html>, not <body>: html and body both set their own `background`
     (see below), and the special "canvas" backdrop that fills space no
     element paints over is drawn from *html's* background specifically —
     toggling this class on body left that backdrop stuck on the
     un-overridden default (visible as a stray green diagonal band cutting
     through the new maroon theme wherever #bgStripes' mask is transparent). */
  html.favorites-theme {
    --bg-base: #613437;
    --bg-stripe: #533132;

    --panel-dark: #2C1C1C;
    --pill-dim: #653D40;
    --pill-bright: #77494B;

    --badge-rank: #875658;
    --more-bg: #875658;
    --more-bg-hover: #976365;
    --desc-bg: #2C1C1C;
    --desc-scroll-thumb: rgba(135, 86, 88, 0.60);
    --refresh-bg: #FFF0F0;
    --refresh-icon: #553133;
    --refresh-icon-hover: #77494B;

    --header-fav-bg: #FFF0F0;
    --header-fav-heart-active: #77494B;

    --divider-color: #2C1C1C;

    --option-muted: #AF8888;
    --option-hover: #DDB9B9;
    --text-hover: #E0CBCB;

    --last-updated-color: #916B6C;

    --eskimo-hover: #E0CBCB;
    --web-hover: #BAB591;
    --header-fav-heart-hover: #94696B;
  }

  * { box-sizing: border-box; }

  /* Smooth cross-fade whenever a themed color changes — right now that's
     only the favorites-palette toggle above (html.favorites-theme), but
     this covers any future theme swap the same way. Every themed color
     lives in a CSS custom property consumed via var(); transitioning the
     *consuming* property here (background-color/color/fill) still animates
     smoothly across a custom-property change without needing to formally
     register the custom property itself via @property — the browser just
     recomputes the before/after used color for background-color et al. and
     transitions between those like any other color change. Broad selector
     rather than enumerating every themed rule individually, since the
     themed vars feed dozens of unrelated selectors (panels, pills, badges,
     dividers, dropdown text); paint-only properties, so this is compositor-
     cheap and never triggers layout. */
  *, *::before, *::after {
    transition: background-color 0.3s ease, color 0.3s ease, fill 0.3s ease;
  }

  /* Every wobbly hand-drawn shape (panels, badges, buttons, dropdown
     backgrounds) is a plain PNG alpha mask, not a live SVG filter — see
     scripts/render-masks.py. Safari renders the feTurbulence/
     feDisplacementMap "wobble" filter soft/blocky no matter how the SVG is
     hosted or how the page is scaled; a raster mask has no filter left for
     any engine to mis-render, and `background-color` still drives the
     theme color so these stay recolorable for a future palette swap. */
  .divider, .video-bg, .contacts-bg, #toolbarBg,
  .badge-rank-inner, .badge-fav-inner, .fav-heart-mask, #applyBtnBg,
  .play-btn-circle, .play-btn-triangle, .pill-bg, #udPanel .dd-bg,
  .more-btn-back, .more-btn-symbol, .description-back {
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  html, body {
    margin: 0;
    /* Only ever visible in two edge cases: a heavy-reflow repaint gap
       before #bgBase/#bgStripes are composited in (e.g. hundreds of rows
       unmounting when a filter empties the list), or Safari's rubber-band
       overscroll dragging those fixed layers away from the viewport edge
       further than their overhang covers (see #bgStripes below). Deliberately
       --bg-stripe, not --bg-base: the ordinary gap-between-stripes color
       is #bgBase's job now, so this fallback only has to look right for
       those two rare glimpses, and the user wants *that* to read as "more
       stripe" rather than "flat base color" at the top of the page. */
    background: var(--bg-stripe);
    /* user-select is inherited, so setting it here once covers literally
       everything by default — page title, last-updated, header buttons,
       rank badges, the video/thumbnail, contact icons/labels/star/cross
       badges, the background gaps above and below the header, the side
       vignette strips, all of it — without having to chase down every
       individual chrome element that could otherwise still start a drag-
       select. .row-head-title/.row-head-meta opt back into text below,
       since those are actual content (a game's title, its view count)
       the user does want to be able to select/copy. */
    -webkit-user-select: none;
    user-select: none;
  }

  /* Both overflow axes live on html only — deliberately NOT on body at all,
     on either axis (see body below). html is the actual root scroller here
     (it specifies its own overflow, so per the standard html/body
     overflow-propagation rule, body's overflow never propagates to the
     viewport regardless of what body sets — html always wins once it has
     an explicit value of its own).

     overflow-y:scroll always reserves the vertical scrollbar's track, even
     when the page is short enough not to need one yet. rescale() below
     derives #canvas's whole zoom scale from window.innerWidth, and
     innerWidth itself shrinks by the scrollbar's width whenever one is
     present — on a system where the scrollbar takes up layout space
     (reserved-space scrollbars; overlay scrollbars like default-config
     macOS don't hit this) that makes the scrollbar's own presence and the
     width rescale() measures mutually dependent: a filter combo landing
     near the "content height ≈ viewport height" boundary can flip the
     scrollbar on and off the DOM only ever settles one state at a time,
     one filter change too late, so it visibly hunts between "just needs a
     sliver of scroll" and "doesn't fit, needs more" without ever reaching
     a stable size. Reserving the track permanently makes it a constant,
     breaking that feedback loop.

     overflow-x:hidden used to live on both html and body too (harmless on
     its own), but that turned out to matter a lot in combination with the
     bug above: giving body ANY explicit overflow-x, on its own, forces its
     overflow-y to compute as auto instead of visible even when overflow-y
     is left unset (per the CSS overflow spec, an element can't have one
     axis visible and the other non-visible — the visible axis silently
     becomes auto instead). Combined with body's height being set from JS
     (see rescale()) to *approximate* #canvas's rendered height — and that
     JS estimate vs. canvas's true on-screen height (post-zoom) differing
     by a sub-pixel fraction that flips sign depending on window width
     *and* total row count (verified directly: e.g. at 1277px wide, canvas
     measured ~0.19px taller than the height JS had set on body) — body's
     forced-auto overflow-y would occasionally have a fraction-of-a-pixel
     of real overflow to scroll, and a wheel/trackpad gesture scroll-chains
     to the nearest scrollable ancestor first: body's own near-zero scroll
     range would silently capture the gesture, consume it within that
     near-zero range, and only chain the remainder up to html once
     exhausted. That's exactly "scroll moves the page a tiny bit and won't
     page through further" — varying by width/row-count because the
     sub-pixel rounding does. Moving overflow-x to html-only means body
     never specifies overflow on either axis, so it just stays at the
     initial visible/visible — no auto-forcing rule ever applies, and body
     can't compete with html as a scroll target regardless of any future
     rounding drift between its JS-set height and canvas's true size. */
  html {
    overflow-x: hidden;
    overflow-y: scroll;
  }

  body {
    font-family: "Darumadrop One", "Segoe UI", sans-serif;
    color: var(--text);
  }

  @media (max-width: 1024px) {
    html, body {
      overflow-x: auto !important;
    }
  }

  /* fixed to the viewport (not a descendant of #canvas) so its size never
     depends on how many rows are rendered — an angled repeating-gradient's
     phase is computed from its own box dimensions, so anchoring it to
     #canvas instead made the whole stripe pattern visibly jump every time
     a filter changed the row count and thus canvas's height.
     No z-index here on purpose: a z-index:-1 on this element let html/
     body's own (fallback) background paint above it instead of below,
     hiding the stripes entirely. Relying on plain DOM order instead — this
     div and #bgBase both come before #canvas in markup, so #canvas
     naturally paints over both with everything left at z-index:auto.
     #bgBase is a second, identically-sized plain-color layer *behind*
     this one, supplying the gap-between-stripes color — split out from
     html/body's own background specifically so that background is free to
     be a different color (see html, body above) without also recoloring
     every gap in the normal, everyday view.
     The stripe itself is a small tiled mask PNG (scripts/render-bg-
     stripes.py), not a plain CSS gradient painted across the whole
     element — Chromium shows a faint horizontal seam where it internally
     tiles the rasterizer for a gradient painted this large, invisible
     while content covered most of the viewport but obvious once a filter
     (e.g. upload date = "today") leaves most of the background exposed.
     Small tiled images don't hit that bug. It's a mask (not a plain
     background-image) so --bg-stripe can still be swapped per-theme (see
     html.favorites-theme above) instead of being baked into the PNG. */
  #bgBase, #bgStripes {
    /* overhangs the viewport on every side (rather than a plain inset:0)
       as a cushion against Safari's rubber-band overscroll bug: Safari
       drags `position:fixed` elements along with the whole page during
       the bounce instead of holding them pinned to the viewport, so a
       flush-fitted fixed layer briefly reveals bare page background above
       the fold. The overhang keeps both layers in view through any
       reasonably-sized bounce; only the flat html/body background (see
       above) is left to cover bounces bigger than that. */
    position: fixed;
    inset: -400px;
  }
  #bgBase {
    background-color: var(--bg-base);
  }
  #bgStripes {
    background-color: var(--bg-stripe);
    -webkit-mask-image: url(assets/masks/bg-stripes.png?v=2);
    mask-image: url(assets/masks/bg-stripes.png?v=2);
    -webkit-mask-repeat: repeat;
    mask-repeat: repeat;
    /* was 396px — widened to 659px (see scripts/render-bg-stripes.py) so
       fewer, bigger stripes show on screen (4-5 instead of 7-8) */
    -webkit-mask-size: 659px 659px;
    mask-size: 659px 659px;
    -webkit-mask-position: 0 0;
    mask-position: 0 0;
    /* 659px (one full tile — see mask-size above) at 30px/s = 21.97s per
       loop. Sliding by exactly one tile period means the pattern lines up
       identically with where it started, so the loop point is seamless —
       this can run forever without ever visibly resetting or running out
       of stripe, regardless of how long the page stays open. */
    animation: bgStripesScroll 21.97s linear infinite;
  }
  @keyframes bgStripesScroll {
    from { -webkit-mask-position: 0 0; mask-position: 0 0; }
    to { -webkit-mask-position: 0 659px; mask-position: 0 659px; }
  }

  #canvas {
    /* PAGE_SCALE (see rescale() below) can shrink this below the viewport's
       own width now, unlike before when zoom always stretched it to fill
       exactly edge-to-edge — margin:auto centers the leftover space evenly
       instead of everything bunching up against the left edge. */
    position: relative;
    width: 1920px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  /* purely decorative side vignettes — inert to input (pointer-events:none
     also makes them unselectable and click/hover-through, no separate
     user-select rule needed). Siblings of #canvas (not children) and
     position:fixed, same as #bgBase/#bgStripes/.fixed-ui-anchor.
     Used to live *inside* #canvas instead, position:absolute with top:0/
     bottom:0 stretched to canvas's own (content-driven) height — that
     caused two separate problems: a short/empty page (e.g. favorites with
     nothing saved yet) left canvas shorter than the real viewport, so the
     vignette's bottom edge fell short of the screen instead of reaching
     it; and for a long list, that height could run to tens of thousands
     of pixels, painting this gradient across a box that large — visibly
     failing to keep up mid-fast-scroll, the same class of rasterizer cost
     that made #bgStripes switch to a small tiled mask instead of one
     page-spanning gradient (see #bgStripes above). Fixed to the viewport
     instead, its box is always exactly one screen tall no matter how long
     the page is, so there's nothing left to fall short of or lag behind.
     zoom (set in rescale(), not a JS-computed pixel width) keeps its width
     proportional to the 1920px design at any window size — the same
     trick, for the same reason, as .fixed-ui-anchor below: a static px
     size here is in the element's own *local*, pre-zoom coordinate space,
     so giving it the same zoom as #canvas reproduces the exact on-screen
     width canvas's own content gets, without needing to be a descendant
     of it. */
  .page-vignette {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 311px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.3;
  }
  /* more opaque edge sits at the page's own corner in both cases */
  .page-vignette-left {
    left: 0;
    background: linear-gradient(to left, transparent 0%, #000000 100%);
  }
  .page-vignette-right {
    right: 0;
    background: linear-gradient(to right, transparent 0%, #000000 100%);
  }

  .page {
    /* 1291, matching #toolbarWrap exactly (was 1293) — both are centered
       independently within #canvas via margin:0 auto, so mismatched
       widths meant their left edges landed half a px apart; rows need to
       align exactly with the header now (see .row below) */
    position: relative;
    z-index: 1;
    width: 1291px;
    margin: 0 auto;
    padding-top: 40px;
  }

  /* ---------------- toolbar ---------------- */
  /* every offset below is taken verbatim from the 1920x1080 design spec,
     measured from the header box (#toolbarArea, 1291x101) unless noted */

  #toolbarWrap {
    position: relative;
    z-index: 2;
    width: 1291px;
    height: 351px;
    margin: 0 auto;
  }

  #pageTitle {
    /* height was 195px (95->0 = 15px gap to #toolbarArea below, which sits
       at top:210px) — shortened by 20px so the same math lands on the
       requested 35px gap instead: 210 - 175 = 35. Measured in-browser
       first: for this particular title, the text's own line-box bottom
       already coincides exactly with the box's bottom edge (align-items:
       flex-end), so shrinking the box moves the visible text up by
       exactly the same amount — no extra font-metric correction needed
       here, unlike most other text in this file. */
    position: absolute;
    top: 0;
    right: -2px;
    height: 175px;
    margin: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    font-weight: 400;
    font-size: 90px;
    color: var(--text);
    white-space: nowrap;
    -webkit-user-select: text;
    user-select: text;
  }
  #pageTitle a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  #pageTitle a:hover {
    color: var(--eskimo-hover, #B5C5A8);
  }

  #lastUpdated {
    /* base position: -18px = its own box overlaps 18px up into #pageTitle's
       box (175 - 18 = 157), per spec — not a font-metric correction like
       most negative offsets elsewhere in this file. Raised another 8px on
       top of that per a later request (157 - 8 = 149). */
    position: absolute;
    top: 149px;
    right: 0;
    margin: 0;
    font-size: 35px;
    color: var(--last-updated-color);
    white-space: nowrap;
  }

  #toolbarArea {
    position: absolute;
    z-index: 1;
    top: 210px;
    left: 0;
    width: 1291px;
    height: 101px;
  }
  #toolbarBg {
    position: absolute;
    /* grown 6px/side to cover the 6px margin around the 1291x101 spec shape */
    inset: -6px;
    z-index: 0;
    background-color: var(--panel-dark);
    -webkit-mask-image: url(assets/masks/toolbar.png?v=2);
    mask-image: url(assets/masks/toolbar.png?v=2);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  /* "upload date" / "max. views" pills — back to three independently
     positioned pieces (strip + title + arrow), per source: only the title
     rect carries the wobble filter, so only it needs a PNG mask; the strip
     and arrow are flat colors and are just plain CSS rounded rects. All
     three are positioned in #toolbarArea-absolute coordinates (left/top
     measured from the header box), derived from the same tight geometry
     the combined-group experiment used (see scripts/render-masks.py). */
  .pill-strip {
    /* same top/height as .pill-title (upload date is the reference) —
       every shape in the header, including this strip and the arrow
       below, shares one horizontal line. top = (101 - 65.7831) / 2, so the
       gap above and below every button is identical (vertically centered
       in #toolbarArea rather than the old, slightly-off 17.22/18 split). */
    position: absolute;
    top: 17.60845px;
    height: 65.7831px;
    width: 125.12px;
    border-radius: 16px;
    background-color: var(--pill-dim);
    z-index: 1;
  }
  .pill-bg {
    position: absolute;
    inset: -10px;
    z-index: 2;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  #udTitleBg {
    background-color: var(--pill-bright);
    -webkit-mask-image: url(assets/masks/ud-title.png?v=2);
    mask-image: url(assets/masks/ud-title.png?v=2);
    z-index: 15;
  }
  #udStripBg {
    background-color: var(--pill-dim);
    -webkit-mask-image: url(assets/masks/ud-strip.png?v=2);
    mask-image: url(assets/masks/ud-strip.png?v=2);
    z-index: 1;
  }
  #udArrowBg {
    background-color: var(--pill-bright);
    -webkit-mask-image: url(assets/masks/ud-arrow.png?v=2);
    mask-image: url(assets/masks/ud-arrow.png?v=2);
    z-index: 2;
  }
  #mvTitleBg {
    background-color: var(--pill-bright);
    -webkit-mask-image: url(assets/masks/mv-title.png?v=2);
    mask-image: url(assets/masks/mv-title.png?v=2);
    z-index: 15;
  }
  #mvStripBg {
    background-color: var(--pill-dim);
    -webkit-mask-image: url(assets/masks/mv-strip.png?v=2);
    mask-image: url(assets/masks/mv-strip.png?v=2);
    z-index: 1;
  }
  #mvArrowBg {
    background-color: var(--pill-bright);
    -webkit-mask-image: url(assets/masks/mv-arrow.png?v=2);
    mask-image: url(assets/masks/mv-arrow.png?v=2);
    z-index: 2;
  }
  #udStrip {
    left: 253.34px;
    width: 116px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;
  }
  #mvStrip {
    left: 597.4px;
    width: 125px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;
  }

  /* plain flat rounded rect, no wobble/mask — see the comment on .dd-wrap
     below for why this whole family of shapes dropped the raster-mask
     approach */
  .pill-title {
    position: absolute;
    top: 17.60845px;
    height: 65.7831px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    background-color: var(--pill-bright);
    border-radius: 16px;
  }
  .pill-title span, #contactsTitle span {
    /* Darumadrop One's line box reserves far more space below the
       baseline than the glyphs actually use, so flex-centering the line
       box (as opposed to the visible ink) leaves the text looking too low
       — nudge up by the measured ink/line-box center offset at 45px
       (fontBoundingBox 52/13 vs actualBoundingBox ~29/6) to compensate,
       then back down 3px per user request. */
    position: relative;
    top: -4.8px;
  }
  .pill-title span { font-size: 45px; color: var(--text); white-space: nowrap; }
  #udTitle {
    left: 18px;
    width: 288px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;
  }
  #udTitle span, #udArrow .arrow-icon, #mvTitle span, #mvArrow .arrow-icon, #contactsTitle span {
    position: relative;
    z-index: 20;
  }
  #mvTitle {
    left: 407.4px;
    width: 256px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;
  }

  .pill-arrow {
    /* same top/height as .pill-title — see .pill-strip above */
    position: absolute;
    top: 17.60845px;
    height: 65.7831px;
    width: 67px;
    border-radius: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    background-color: var(--pill-bright);
  }
  .pill-arrow .arrow-icon {
    display: block;
    width: 25px;
    height: 14px;
    transform: rotate(0deg);
    transition: transform 0.35s ease;
  }
  .pill-arrow.dir-desc .arrow-icon { transform: rotate(180deg); }
  #udArrow {
    left: 314px;
    width: 67px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;
  }
  #mvArrow {
    left: 672.4px;
    width: 67px;
    height: 65px;
    background-color: transparent;
    border-radius: 0;
    z-index: auto;

  /* opacity-only cross-fade when a filter/sort actually swaps the list's
     contents (see render()'s resetView path in the script below) — not a
     per-row stagger, just the whole list fading out then back in around
     the instant content swap, so it never looks like the page snapped.
     fadeRowsOut and fadeRowsIn run one after the other (not at the same
     time), so the full out-then-in cycle takes 2x this duration — 0.25s
     here adds up to ~0.5s total.
     linear, not ease: measured both phases directly (transitionend
     timestamps) and they already ran the same duration each with no gap
     between them — the "fade in feels quicker" read wasn't a timing bug,
     it's `ease`'s own curve. `ease` decelerates hard into its end in both
     directions, so fading in, opacity rushes up early and then just
     lingers near-full for the back half (reads as "snapped in, then
     nothing happens"), while fading out it drops out early and lingers
     near-zero (the perceptible vanishing is bunched into the front half).
     Same total duration, unevenly distributed, in mirrored ways — linear
     spreads the visible change evenly across the whole duration in both
     directions instead.
     In Safari (WebKit CoreAnimation), when a container (.rows) transitions
     opacity, any descendant with a positive z-index (.badge-rank, .badge-fav
     at z-index: 2) and -webkit-mask-image is promoted to a composited CALayer.
     Without an explicit stacking context and group-opacity hardware layer on
     .rows (and .row / .video-wrap), WebKit hoists those badge CALayers out of
     the .rows opacity hierarchy to the nearest enclosing stacking context (.page),
     causing them to escape the fade transition and remain 100% opaque while
     the rest of the row fades out.
     Establishing explicit stacking contexts (z-index: 1, isolation: isolate)
     and hardware-accelerated layer groups (translate3d(0,0,0), will-change: opacity)
     on .rows, .row, and .video-wrap traps all child CALayers inside the .rows
     group layer so the entire interface fades cleanly together in Safari. */
  .rows {
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s linear;
    position: relative;
    z-index: 1;
    isolation: isolate;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    will-change: opacity;
  }

    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);

    mask-image: url(assets/masks/fav-heart.png?v=2);

  .badge-fav:not(.active):hover .fav-heart-mask {
    background-color: #FFFFFF;

  .contacts-wrap {
    /* tight/visible size now (was 397x438, the mask's old padded-canvas
       size) — same reasoning as .video-wrap above */
    position: relative;
    z-index: 1;
    isolation: isolate;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    width: 391px;
    height: 509px;
    flex: 0 0 auto;
  }
  .contacts-bg {
    position: absolute;
    /* grown 6px/side, same reasoning as #toolbarBg above */
    inset: -6px;
    background-color: var(--panel-dark);
    -webkit-mask-image: url(assets/masks/contacts-bg.png);
    mask-image: url(assets/masks/contacts-bg.png);
  }

  #toolbarBg,
  #udPanel .dd-bg, #mvPanel .dd-bg, #contactsPanel .dd-bg,
  .divider,
  .video-bg,
  .contacts-bg {
    filter: drop-shadow(0 13px 10px rgba(0, 0, 0, 0.10));
  }

  /* 5 rows x 79px icons + 4 gaps x 16px = 459; contacts-wrap is 509 tall,
     so the 50px left over splits evenly to 25px top/bottom padding —
     replaces the old justify-content:space-evenly (which just spread
     whatever space was left however the flexbox algorithm saw fit) with
     an exact, spec'd gap instead. */
  .contacts-list {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 25px 30px;
  }
  .contact-row { display: flex; align-items: center; gap: 18px; }
  .contact-row a { display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; }
  .contact-icon-wrap { position: relative; width: 79px; height: 79px; flex: 0 0 auto; }
  .contact-icon-wrap .icon { display: block; width: 100%; height: 100%; object-fit: contain; }
  .contact-icon-wrap .badge {
    /* top-left now (was top-right) — offset keeps the same proportion of
       the badge sitting inside vs. outside the icon as the old
       top:-10px/26px badge did, scaled up to the new 32px size */
    position: absolute; top: -12px; left: -12px;
    display: block;

  .contact-icon-wrap .badge-cross { width: 32px; height: 32px; }
  .contact-icon-wrap .badge-star { width: 39px; height: 37px; }
  .contact-label {
    /* same Darumadrop One ink/line-box story as .pill-title span — flex
       align-items:center centers the font's oversized natural line box,
       not the visible ink, so text sits visibly low against its icon
       without this. Measured directly per-label (canvas
       actualBoundingBoxAscent/Descent vs the icon's true center); -6px is
       the consensus across steam/discord/insta/web (single-letter "x",
       with no ascender/descender at all, wants closer to -9px, but a
       shared constant close to the other four reads better overall). */
    position: relative;
    top: -6px;
    font-size: 45px;
    color: var(--text);
  }
  .contact-row.missing .contact-label { color: var(--contact-label-inactive); }

  .contact-row-steam a:hover .contact-label { color: #8A96B8; }
  .contact-row-discord a:hover .contact-label { color: #BCB2E3; }
  .contact-row-twitter a:hover .contact-label { color: #899EBA; }
  .contact-row-insta a:hover .contact-label { color: #D298A2; }
  .contact-row-web a:hover .contact-label { color: var(--web-hover, #A7B898); }

  .empty-state {
    color: var(--text-muted);

    text-align: center;

  /* favorites-empty variant only ("you don't love anything. heartless.") —

     look above. Centered between the header's bottom edge and the real

     rules win over that rule's `padding`/`text-align` for an element

  .empty-state-favorites {

<script>
const API = "";
const FAVORITES_KEY = "indie-tracker-favorites";

/* ---------------- YouTube embed player ---------------- */

/* A bare <iframe src="…/embed/ID"> gives no way to tell a working embed
   apart from one YouTube refuses to play (owner disabled embedding,
   region lock, etc.) — both just load successfully as far as the browser
   is concerned, since YouTube renders its own "can't play this video"
   screen *inside* the iframe rather than failing the request. That inner
   content is cross-origin and invisible to us, so the video silently
   shows as a plain black rectangle with no explanation. The IFrame Player
   API talks to the embedded player over postMessage instead, which does
   surface an onError callback for exactly this case — letting us swap in
   a real "can't play this here, watch on YouTube" fallback. */
const ytApiReadyPromise = new Promise(resolve => {
  window.onYouTubeIframeAPIReady = resolve;
});
// Lazy: only actually fetch the (~50KB, third-party, mutates a bunch of
// window-level state) script once a video is actually clicked, instead of
// on every single page load whether or not anyone ever presses play.
let ytApiLoadStarted = false;
function ensureYouTubeIframeApiLoading() {
  if (ytApiLoadStarted) return;
  ytApiLoadStarted = true;
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

function showEmbedError(container, watchUrl) {
  container.innerHTML = `
    <div class="embed-error">
      <p>This video can't be played here.</p>
      <a href="${watchUrl}" target="_blank" rel="noopener">Watch on YouTube ↗</a>
    </div>`;
}

// Tracks every currently-playing inline player, keyed by its .video-thumb
// container, so a scroll far enough away from it (see stopDistantVideos,
// hooked into the scroll listener below) can stop it automatically instead
// of leaving audio/video running somewhere off-screen indefinitely.
const activePlayers = new Map(); // container -> { player, originalHtml }
const VIDEO_AUTOSTOP_DISTANCE = 4000;

function stopDistantVideos() {
  activePlayers.forEach((info, container) => {
    // render() (filter/sort changes, favorites toggle, etc.) can wipe #rows
    // — including a row with a video still playing in it — without going
    // through here at all; the removed iframe's browsing context is torn
    // down by the browser regardless, so nothing keeps playing, but the
    // stale map entry needs clearing out next time this runs.
    if (!container.isConnected) {
      activePlayers.delete(container);
      return;
    }
    const rect = container.getBoundingClientRect();
    const tooFarAbove = rect.bottom < -VIDEO_AUTOSTOP_DISTANCE;
    const tooFarBelow = rect.top > window.innerHeight + VIDEO_AUTOSTOP_DISTANCE;
    if (!tooFarAbove && !tooFarBelow) return;
    info.player.destroy();
    container.innerHTML = info.originalHtml;
    // re-attaches just the thumbnail <img>'s load/error fallback listener
    // (see renderThumbnailImg/attachRowListeners) — container itself
    // (.video-thumb) isn't a descendant of itself, so this can't also
    // re-attach a duplicate click listener onto it.
    attachRowListeners(container);
    activePlayers.delete(container);
  });
}

async function playVideoInline(container, videoId, watchUrl) {
  ensureYouTubeIframeApiLoading();
  const originalHtml = container.innerHTML;
  const playerId = `yt-player-${videoId}-${Math.random().toString(36).slice(2)}`;
  const wrapId = `${playerId}-wrap`;

  // .video-thumb lives inside #canvas, which is scaled with CSS `zoom`
  // (not transform — see rescale() below) so the whole design re-lays-out
  // at the viewport's actual width instead of stretching a cached bitmap.
  // Chrome propagates that ambient zoom into nested iframes' own layout
  // fine; Safari doesn't reliably carry it through to the embedded
  // YouTube player's internal size negotiation, so the video renders at
  // some other (often default 640x390-ish) size inside an otherwise
  // correctly-sized but now mostly-blank iframe — passing explicit
  // width/height to YT.Player (tried first) didn't change that, because
  // the mismatch isn't between *our* CSS and the iframe element, it's
  // between the ambient zoom and whatever YouTube's own script measures
  // from inside the iframe.
  //
  // Fix: cancel the ambient zoom for just this subtree (wrapper zoom =
  // 1 / canvas's zoom, so the two multiply out to 1 — same trick already
  // used for #fixedUiAnchor below, which is kept a sibling of #canvas for
  // the same reason) and size the now-effectively-unzoomed wrapper with
  // real on-screen pixels (getBoundingClientRect already reports the
  // post-zoom size, in both browsers). YouTube then sees a perfectly
  // ordinary, unzoomed iframe matching its own size exactly, regardless
  // of whatever the rest of the page's zoom is doing.
  const canvasScale = parseFloat(document.getElementById("canvas").style.zoom) || 1;
  const rect = container.getBoundingClientRect();
  const w = Math.round(rect.width);
  const h = Math.round(rect.height);

  container.innerHTML = `<div id="${wrapId}" style="zoom:${1 / canvasScale}; width:${w}px; height:${h}px;"><div id="${playerId}"></div></div>`;
  await ytApiReadyPromise;
  // the click may have re-rendered the row (filter/sort change) before the
  // API finished loading — don't mount a player into a detached node
  if (!document.getElementById(playerId)) return;
  const player = new YT.Player(playerId, {
    width: w,
    height: h,
    videoId,
    playerVars: { autoplay: 1 },
    events: {
      onError: () => {
        showEmbedError(container, watchUrl);
        activePlayers.delete(container);
      },
    },
  });
  activePlayers.set(container, { player, originalHtml });
}

/* icon uses the same stroke template inlined so it can follow --refresh-icon.
   No filter on this one (plain stroked path), so it was never affected by
   the Safari issue — left as a live inline SVG. */
document.getElementById("applyBtnIcon").outerHTML = `

/* ---------------- state ---------------- */

let allGames = [];
let sortField = "views";        // "views" | "date"
let sortDirection = "desc";
let appliedPriority = [];   // drives the actual sort/badges in the results list
let pendingPriority = [];   // what's checked in the dropdown right now, not yet applied
let favorites = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]"));
let showingFavoritesOnly = false;
// Game ids whose description panel is currently expanded — survives across
// render()'s full DOM rebuilds (switching filter tabs, applying preferred
// contacts, etc.) so an opened description doesn't silently re-collapse
// just because its row happened to get torn down and recreated.
const openDescriptions = new Set();

const PERIOD_OPTIONS = [

  { value: "3d", label: "last 3 days" },
  { value: "7d", label: "last 7 days" },
  { value: "14d", label: "last 14 days" },

  { value: "10000", label: "10 000" },
  { value: "100000", label: "100 000" },
  { value: "", label: "unlimited" },
];
let metricValue = "";

const CONTACT_TYPES = [

];

/* ---------------- brand/badge icons ----------------
   These are plain PNGs (pre-rendered from the source SVGs at 8x, in
   frontend/assets/png/), not live SVG-with-filter. Safari has a
   long-standing bug where an SVG carrying feTurbulence/feDisplacementMap
   (our hand-drawn wobble) rasterizes soft/blocky — inlining the SVG (so
   Chromium recomputes it) and switching #canvas from `transform: scale`
   to `zoom` both failed to change that in real Safari, so the filter
   itself is the problem, not how it's hosted or scaled. A plain raster
   image has no filter left to mis-render at request time in any engine —
   see scripts/render-icons.py for how these were generated. */
const PNG_ASSETS = "assets/png";
const ICON_FILES = { steam: "steam", discord: "discord", twitter: "twitter", insta: "insta", web: "web" };
const STAR_FILES = ["star-1", "star-2"];
const CROSS_FILES = ["cross-1", "cross-2"];

// Pinned once per contact type, not re-rolled on every renderContactsDropdown
// render — that function re-renders the *entire* options list on every
// single toggle (see below), so picking a fresh Math.random() per option on
// each render made every already-selected star jump to a possibly-different
// variant alongside the one actually being toggled.
const CONTACT_STAR_FILE = {};
CONTACT_TYPES.forEach(opt => {
  CONTACT_STAR_FILE[opt.value] = STAR_FILES[Math.random() < 0.5 ? 0 : 1];
});

/* ---------------- data loading ---------------- */

async function loadGames() {
  // Sets the guard *before* the fetch goes out, not after — this used to
  // be a window.scrollTo(0, 0) call right here instead (applying a filter
  // always jumped the page back to the top), which incidentally also fired
  // a real "scroll" event that the listener below turns into a
  // maybeLoadMoreRows() call on the next animation frame. Filters no
  // longer force that scroll (the user asked to stay put wherever they
  // were reading), but the fetch is still async, so without this flag
  // maybeLoadMoreRows() could fire during the gap and run against the
  // *old* currentList/renderedCount (render(true) hasn't replaced them
  // yet), inserting more of the outgoing list's rows into #rows right as
  // the fade-out/fade-in swap (see render()) starts touching the same
  // element — the "part of the old buttons flashes for a split second"
  // glitch this whole guard exists for. render()'s own applyContent()
  // clears the flag once the swap actually happens, same as any other
  // resetView caller.
  renderTransitionInProgress = true;
  const params = new URLSearchParams();
  if (metricValue) params.set("max_metric", metricValue);
  if (periodValue) params.set("period", periodValue);
  const res = await fetch(`${API}/api/games?${params.toString()}`);
  allGames = await res.json();
  render(true);
}

async function loadLastUpdated() {
  const el = document.getElementById("lastUpdated");
  try {
    const res = await fetch(`${API}/api/last-updated`);
    const data = await res.json();
    el.textContent = data.last_updated ? `last updated ${formatRelativeTime(data.last_updated)}` : "";
  } catch {
    el.textContent = "";
  }
}

function sortAndFilter() {
  let list = showingFavoritesOnly ? allGames.filter(g => favorites.has(g.id)) : allGames.slice();

  list.sort((a, b) => {
    // games matching more of the selected preferred contacts rank higher —
    // e.g. with 3 contacts checked, a game with all 3 outranks one with 2,
    // which outranks one with 1, which outranks one with none.
    const aMatches = appliedPriority.filter(t => a.contacts[t]).length;
    const bMatches = appliedPriority.filter(t => b.contacts[t]).length;
    if (aMatches !== bMatches) return bMatches - aMatches;

    const aVal = sortField === "date"
      ? new Date(a.best_source.published_at || 0).getTime()
      : a.best_source.metric_value;
    const bVal = sortField === "date"
      ? new Date(b.best_source.published_at || 0).getTime()
      : b.best_source.metric_value;

    return sortDirection === "asc" ? aVal - bVal : bVal - aVal;
  });

  return list;
}

/* ---------------- dropdowns ---------------- */

/* sums offsetLeft up the chain to `ancestor` — gives a position in
   unscaled design pixels regardless of the #canvas CSS transform, so it
   stays correct at any window size */
function leftRelativeTo(el, ancestor) {
  let x = 0;
  let node = el;
  while (node && node !== ancestor) {
    x += node.offsetLeft;
    node = node.offsetParent;
  }
  return x;
}

/* left-aligns a dropdown's option list to the rendered left edge of its
   (centered) label text, per spec */
function alignOptionsToLabel(labelSpan, panelWrap, optionsEl) {
  /* labelSpan and panelWrap are siblings inside #toolbarArea. panelWrap is a
     hidden .dd-wrap the first time this runs — a display:none element's
     offsetLeft/offsetParent are both useless (report 0/null), so its position
     can't be measured by walking the box tree. Its CSS `left` is a plain
     pixel value though, so computed style gives the real number regardless
     of whether the box is currently rendered. */
  const labelLeft = leftRelativeTo(labelSpan, document.getElementById("toolbarArea"));
  const panelLeft = parseFloat(getComputedStyle(panelWrap).left);
  /* both labelLeft and panelLeft are true absolute (toolbarArea-relative)
     positions already — no margin correction needed here, that only
     matters for the raster masks themselves */
  optionsEl.style.left = (labelLeft - panelLeft) + "px";
}

/* Runs `cb` once the next time `el` fires transitionend for `prop` — and,
   critically, drops any previously-registered callback for this element
   first. Without that, rapidly re-triggering an animation leaves a stale
   listener waiting for a transitionend that will never come once its
   target value gets overwritten by the new animation, silently wedging
   whatever follow-up step it was gating. Used by the #rows fade in
   render() below — the header dropdowns themselves are plain instant
   show/hide (see closeAllDropdowns/openDropdown), no transition. */
function onceTransitionEnd(el, prop, cb) {
  if (el._pendingTransitionHandler) {
    el.removeEventListener("transitionend", el._pendingTransitionHandler);
    clearTimeout(el._pendingTransitionTimeout);
  }
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    el.removeEventListener("transitionend", handler);
    clearTimeout(el._pendingTransitionTimeout);
    el._pendingTransitionHandler = null;
    el._pendingTransitionTimeout = null;
    cb();
  };
  const handler = (e) => {
    if (e.target !== el || e.propertyName !== prop) return;
    finish();
  };
  el._pendingTransitionHandler = handler;
  el.addEventListener("transitionend", handler);
  // Safety net: transitionend isn't guaranteed to fire — a backgrounded/
  // hidden tab can suspend a transition mid-flight (switching away via
  // Mission Control, Spaces, another app grabbing focus, etc.) without
  // ever dispatching its completion event. Without this, that silently
  // wedges whatever was waiting on it forever: a dropdown stuck mid-close,
  // or #rows stuck invisible showing stale content with no way to
  // recover — not even by scrolling, since render()'s
  // renderTransitionInProgress flag would never clear either. 1000ms is
  // comfortably longer than any transition duration actually used in this
  // file (250ms/150ms/120ms), so this never preempts a normal transition,
  // only a genuinely stuck one.
  el._pendingTransitionTimeout = setTimeout(finish, 1000);
}

function closeAllDropdowns() {
  document.querySelectorAll(".dd-wrap").forEach(d => d.hidden = true);
}

function openDropdown(panelId) {
  const panel = document.getElementById(panelId);
  const wasHidden = panel.hidden;
  closeAllDropdowns();
  if (wasHidden) panel.hidden = false;
}

function renderPeriodDropdown() {
  const el = document.getElementById("udOptions");
  el.innerHTML = PERIOD_OPTIONS.map(opt => `
    <div class="dd-option ${opt.value === periodValue ? "selected" : ""}" data-value="${opt.value}"><span>${opt.label}</span></div>
  `).join("");
  el.querySelectorAll(".dd-option").forEach(node => {
    node.addEventListener("click", () => {
      periodValue = node.dataset.value;
      closeAllDropdowns();
      renderPeriodDropdown();
      loadGames();
    });
  });
  alignOptionsToLabel(document.querySelector("#udTitle span"), document.getElementById("udPanel"), el);
}

function renderMetricDropdown() {
  const el = document.getElementById("mvOptions");
  el.innerHTML = METRIC_OPTIONS.map(opt => `
    <div class="dd-option ${opt.value === metricValue ? "selected" : ""}" data-value="${opt.value}"><span>${opt.label}</span></div>
  `).join("");
  el.querySelectorAll(".dd-option").forEach(node => {
    node.addEventListener("click", () => {
      metricValue = node.dataset.value;
      closeAllDropdowns();
      renderMetricDropdown();
      loadGames();
    });
  });
  alignOptionsToLabel(document.querySelector("#mvTitle span"), document.getElementById("mvPanel"), el);
}

function renderContactsDropdown() {
  const el = document.getElementById("contactsOptions");
  el.innerHTML = CONTACT_TYPES.map(opt => {
    const selected = pendingPriority.includes(opt.value);
    const starFile = selected ? CONTACT_STAR_FILE[opt.value] : null;
    return `
      <div class="dd-option dd-option-contact ${selected ? "selected" : ""}" data-value="${opt.value}">
        <span>${opt.label}</span>
        ${starFile ? `<img class="star" src="${PNG_ASSETS}/${starFile}.png" alt="">` : ""}
      </div>`;
  }).join("");
  el.querySelectorAll(".dd-option-contact").forEach(node => {
    node.addEventListener("click", (e) => {
      /* this re-renders the dropdown (replacing `node` itself) before the
         click finishes bubbling, which detaches the event's target from
         the document — the outside-click handler below would then see
         target.closest("#toolbarArea") fail on the detached node and
         treat this as a click outside the dropdown, closing it right
         after every single selection. Stop it from bubbling that far. */
      e.stopPropagation();
      const v = node.dataset.value;
      if (pendingPriority.includes(v)) {
        pendingPriority = pendingPriority.filter(t => t !== v);
        node.classList.remove("selected");
        const star = node.querySelector(".star");
        if (star) star.remove();
      } else {
        pendingPriority.push(v);
        node.classList.add("selected");
        const starFile = CONTACT_STAR_FILE[v];
        if (starFile) {
          node.insertAdjacentHTML("beforeend", `<img class="star" src="${PNG_ASSETS}/${starFile}.png" alt="">`);
        }
      }
      updateApplyButton();
    });
  });
  alignOptionsToLabel(document.querySelector("#contactsTitle span"), document.getElementById("contactsPanel"), el);
}

/* Darumadrop loads async, and alignOptionsToLabel measures the *rendered*
   width of the label text — computing it against the fallback font before
   the real one has swapped in gives a wrong position. Every font-loading
   API turned out to be an unreliable way to know when that swap has
   actually happened: document.fonts.ready doesn't wait for @font-face
   fonts pulled in via an external stylesheet (this Google Fonts <link>) in
   Safari, and switching to the more targeted document.fonts.load() didn't
   fix it there either. So: don't try to detect it at all. Render once now
   (fine even if it's against the fallback font — the panels are `hidden`,
   nobody sees it) and, more importantly, re-render+realign right before
   each dropdown actually opens (see openDropdown calls below) — by the
   time a real click happens the font has unavoidably long since finished
   rendering, regardless of what any loading API claims. */
renderPeriodDropdown();
renderMetricDropdown();
renderContactsDropdown();

document.getElementById("udTitle").addEventListener("click", (e) => {
  e.stopPropagation();
  renderPeriodDropdown(); // re-align against the label's real rendered width — see the comment above
  openDropdown("udPanel");
});
document.getElementById("mvTitle").addEventListener("click", (e) => {
  e.stopPropagation();
  renderMetricDropdown();
  openDropdown("mvPanel");
});
document.getElementById("contactsTitle").addEventListener("click", (e) => {
  e.stopPropagation();
  renderContactsDropdown();
  openDropdown("contactsPanel");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#toolbarArea")) closeAllDropdowns();
});

  viewsArrow.classList.toggle("dir-desc", sortField === "views" && sortDirection === "desc");

document.getElementById("udArrow").addEventListener("click", (e) => {

  else { sortField = "date"; sortDirection = "desc"; }
  updateSortArrows();
